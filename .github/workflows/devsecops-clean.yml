name: Multi-Chain Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Solidity analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'slither-analyzer>=0.10,<1' 'solc-select>=1,<2'

      - name: Install Solidity compiler
        run: |
          solc-select install 0.8.19
          solc-select use 0.8.19

      - name: Run Slither
        if: hashFiles('contracts/*.sol') != ''
        continue-on-error: true
        run: |
          mkdir -p reports
          slither contracts --json reports/slither-report.json || true

      - name: Check Rust formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        if: hashFiles('Cargo.toml') != ''
        run: cargo check --workspace --all-targets

      - name: Audit Rust dependencies
        if: hashFiles('Cargo.toml') != ''
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit --json > reports/cargo-audit.json

      - name: Generate audit manifest
        run: |
          mkdir -p reports
          {
            echo '# Security Audit Run'
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Automated findings are signals for human review; this workflow does not claim to prove audit completeness.'
          } > reports/SECURITY_SUMMARY.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
